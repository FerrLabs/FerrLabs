name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
      packages: read
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@40aa5d1770444d993bc9f681019f8cc0fe597fd8 # main
    with:
      node-version: '24'
      pnpm-version: ''
      enable-sonar: false
      install-args: ''
      enable-lint: true
      lint-script: format:check
      enable-knip: true
      enable-madge: true
      madge-paths: packages/*/src
      enable-audit: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      FERRFLOW_PACKAGES_READ: ${{ secrets.FERRFLOW_PACKAGES_READ }}

  release:
    name: Release
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@40aa5d1770444d993bc9f681019f8cc0fe597fd8 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
